<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip }}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip }}">
  <meta property="og:image" content="{{ '/assets/img/cole-robertson.jpg' | absolute_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&family=Schibsted+Grotesk:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% if site.show_blog %}<link rel="alternate" type="application/atom+xml" href="{{ '/feed.xml' | relative_url }}">{% endif %}
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="site-name" href="{{ '/' | relative_url }}">Cole Robertson</a>
    <nav aria-label="Main">
      <a href="{{ '/research/' | relative_url }}"{% if page.nav == 'research' %} aria-current="page"{% endif %}>Research</a>
      <a href="{{ '/companies/' | relative_url }}"{% if page.nav == 'companies' %} aria-current="page"{% endif %}>Companies</a>
      {% if site.show_blog %}<a href="{{ '/blog/' | relative_url }}"{% if page.nav == 'blog' %} aria-current="page"{% endif %}>Writing</a>{% endif %}
      <a href="{{ '/climbing/' | relative_url }}"{% if page.nav == 'climbing' %} aria-current="page"{% endif %}>Climbing</a>
      <a href="{{ '/contact/' | relative_url }}"{% if page.nav == 'contact' %} aria-current="page"{% endif %}>Contact</a>
      <a href="{{ site.cv_file | relative_url }}">CV</a>
    </nav>
  </header>

  <main id="main">
{{ content }}
  </main>

  <footer class="site-footer">
    <p>&copy; {{ 'now' | date: '%Y' }} Cole Robertson</p>
    <p>
      <a href="{{ site.links.scholar }}">Google Scholar</a>
      <a href="{{ site.links.github }}">GitHub</a>
      <a href="{{ site.links.linkedin }}">LinkedIn</a>
    </p>
  </footer>
</body>
</html>
