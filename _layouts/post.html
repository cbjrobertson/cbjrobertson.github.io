---
layout: default
nav: blog
---
<article class="page post">
  <header>
    <h1>{{ page.title }}</h1>
    <p class="meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%-d %B %Y' }}</time>
      {% if page.crosspost_url %} &nbsp;Also on <a href="{{ page.crosspost_url }}">{{ page.crosspost_name | default: 'Substack' }}</a>{% endif %}
    </p>
  </header>
  <div class="prose">
{{ content }}
{% if page.external_url %}
    <p><a class="button" href="{{ page.external_url }}">Read it on {{ page.external_name | default: 'Substack' }}</a></p>
{% endif %}
  </div>
</article>
